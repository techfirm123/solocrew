name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: solocrew-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.29.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Validate workspace and repository conventions
        run: pnpm run check

      - name: Validate backend Gradle build
        working-directory: backend
        run: ./gradlew check
