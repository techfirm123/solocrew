spring:
  application:
    name: solocrew-backend

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 20s

  modulith:
    runtime:
      verification-enabled: true

  datasource:
    hikari:
      pool-name: SoloCrewConnectionPool
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  sql:
    init:
      mode: never

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
      cleanup-cron: "0 * * * * *"

server:
  port: 8080
  shutdown: graceful

  servlet:
    session:
      cookie:
        name: SOLOCREW_SESSION
        http-only: true
        same-site: lax

      tracking-modes:
        - cookie

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true
