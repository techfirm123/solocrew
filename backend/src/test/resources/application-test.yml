spring:
  config:
    import: optional:file:./local-secrets.properties

  main:
    banner-mode: off

  datasource:
    url: ${SOLOCREW_DATABASE_URL:jdbc:postgresql://localhost:5432/solocrew_test}
    username: ${SOLOCREW_DATABASE_USERNAME:solocrew_app}
    password: ${SOLOCREW_DATABASE_PASSWORD}

    hikari:
      pool-name: SoloCrewTestConnectionPool
      maximum-pool-size: 3
      minimum-idle: 1

  mail:
    host: localhost
    port: 1025
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 1000
      "[mail.smtp.timeout]": 1000
      "[mail.smtp.writetimeout]": 1000

logging:
  level:
    root: WARN

management:
  endpoint:
    health:
      show-details: always
      show-components: always

solocrew:
  mail:
    from: no-reply@solocrew.test
    verification-url-base: http://localhost:3000/verify-email

    # Deterministic test-only AES key.
    # Never use this key outside automated tests.
    encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    outbox:
      enabled: false
      poll-interval-ms: 60000
